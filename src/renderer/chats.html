<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: capri://gallery; font-src 'self'; media-src 'self' capri: blob:; connect-src 'self' capri:">
  <title>ARASAKA AI: GENESIS HUB</title>
  <link rel="icon" href="../../assets/icons/capri.png">
  <link rel="stylesheet" href="styles/capri.css">
  <link rel="stylesheet" href="styles/chats.css">
  <link rel="stylesheet" href="styles/arasaka.css">
  <link rel="stylesheet" href="styles/hub-layout.css?v=5">
</head>
<body>
  <div class="hud">
    <header class="hud__bar">
      <div class="hud__brand"><img class="hud__brand-icon" src="../../assets/icons/capri.png" alt="" width="28" height="28"><span class="hud__who">ARASAKA AI</span><span class="hud__tag">GENESIS HUB</span></div>
      <nav class="hud__tabs" aria-label="Разделы"></nav>
      <h1 class="hud__title"></h1>
    </header>
    <div class="hud__plate" data-tab="chats">
      <aside class="chats">
        <div class="chats__heading"><span>Разговоры</span><span class="hud__count"></span></div>
        <button class="panel__action is-primary hud__new" type="button"></button>
        <input class="panel__input chats__search" type="search" maxlength="80" spellcheck="false" aria-label="Поиск по чатам Capri">
        <ol class="chats__list"></ol>
        <p class="chats__empty" hidden></p>
      </aside>
      <main class="log">
        <header class="log__meta">
          <span class="log__when"></span>
          <span class="log__live" hidden></span>
          <button class="panel__action log__delete" type="button" hidden></button>
        </header>
        <ol class="log__lines"></ol>
        <div class="log__resume" hidden>
          <span class="log__resume-note"></span>
          <button class="panel__action is-primary log__resume-go" type="button"></button>
        </div>
        <div class="log__ask" hidden>
          <span class="log__ask-line"></span>
          <span class="log__ask-actions"></span>
        </div>
        <form class="log__compose" autocomplete="off">
          <button class="panel__action log__mic" type="button"></button>
          <input class="panel__input log__input" type="text" maxlength="500" spellcheck="false">
          <button class="panel__action is-primary log__send" type="submit"></button>
        </form>
        <p class="log__hint" hidden></p>
      </main>
    </div>
    <div class="hud__plate" data-tab="agents" hidden>
      <nav class="agents__providers" aria-label="Агенты"></nav>
      <aside class="chats">
        <div class="chats__heading"><span>Разговоры</span><span class="agents__count"></span></div>
        <button class="panel__action is-primary agents__new" type="button">＋ Новый разговор</button>
        <input class="panel__input agents__search" type="search" maxlength="80" placeholder="Найти разговор…" aria-label="Поиск разговоров агента">
        <div class="chats__list agents__list"></div>
        <details class="agents__history-tools" hidden>
          <summary>Импорт истории</summary>
          <button class="panel__action agents__local" type="button" hidden>Найти локальные чаты</button>
          <button class="panel__action agents__import" type="button" hidden>Выбрать файл</button>
        </details>
      </aside>
      <main class="log">
        <header class="log__meta agents__meta">
          <div><span class="agents__label"></span><h2 class="agents__title">Выбери разговор</h2></div>
          <span class="agents__run" hidden>В работе</span>
        </header>
        <div class="agents__quota" hidden>
          <span class="agents__quota-group"></span>
          <span class="agents__quota-values" aria-live="polite"></span>
          <button class="panel__action agents__quota-refresh" type="button">Обновить</button>
          <details class="agents__quota-edit" hidden>
            <summary>Снимок квоты</summary>
            <form class="agents__quota-form">
              <label class="agents__quota-short-label">5 ч, остаток % <input class="agents__quota-short panel__input" type="number" min="0" max="100" step="0.01"></label>
              <label>Неделя, остаток % <input class="agents__quota-week panel__input" type="number" min="0" max="100" step="0.01" required></label>
              <button class="panel__action" type="submit">Записать</button>
            </form>
          </details>
        </div>
        <div class="agents__welcome" hidden>
          <span class="agents__welcome-mark" aria-hidden="true"></span>
          <strong>Начни разговор</strong>
          <span>Выбери чат слева или создай новый.</span>
        </div>
        <ol class="log__lines agents__lines" aria-label="Переписка"></ol>
        <p class="log__hint agents__status" role="status"></p>
        <form class="log__compose agents__compose" autocomplete="off">
          <textarea class="panel__input agents__input" maxlength="8000" rows="2" aria-label="Сообщение" placeholder="Написать агенту…"></textarea>
          <div class="agents__actions">
            <label class="agents__model-label">Модель <select class="panel__input agents__model"></select></label>
            <button class="panel__action agents__retry" type="button" hidden>Повторить</button>
            <button class="panel__action is-primary agents__send" type="submit">Отправить</button>
          </div>
        </form>
      </main>
    </div>
    <div class="hud__plate hud__plate--one" data-tab="plans" hidden>
      <section class="plans">
        <form class="plans__form" autocomplete="off">
          <select class="panel__input plans__kind"></select>
          <input class="panel__input plans__title" type="text" maxlength="300" spellcheck="false">
          <label class="plans__when"><span class="plans__at-label"></span><input class="panel__input plans__at" type="datetime-local"></label>
          <label class="plans__until"><span class="plans__end-label"></span><input class="panel__input plans__end" type="datetime-local"></label>
          <input class="panel__input plans__notes" type="text" maxlength="2000" spellcheck="false">
          <button class="panel__action is-primary plans__add" type="submit"></button>
        </form>
        <p class="plans__error" hidden></p>
        <nav class="plans__views"></nav>
        <ol class="plans__list"></ol>
      </section>
    </div>
    <div class="hud__plate hud__plate--one" data-tab="gallery" hidden>
      <section class="gallery">
        <p class="gallery__note"></p>
        <ol class="gallery__grid"></ol>
        <figure class="gallery__big" hidden><img alt=""><video muted loop playsinline hidden></video><figcaption></figcaption></figure>
      </section>
    </div>
    <div class="hud__plate hud__plate--one" data-tab="settings" hidden>
      <section class="settings"></section>
    </div>
  </div>
  <script type="module" src="js/chats-window.js"></script>
  <script type="module" src="js/hub.js"></script>
</body>
</html>
